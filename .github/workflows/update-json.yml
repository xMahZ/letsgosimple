name: Update Finance Data

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job a ejecutar (job1, job2, job3, all)"
        required: false
        default: "all"
  repository_dispatch:
    types: [cloudflare_update]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run finance script
        run: |
          JOB="${{ github.event.client_payload.job || github.event.inputs.job || 'all' }}"
          echo "Ejecutando: $JOB"
          python scripts/update-finance.py $JOB
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: update finance data"
          git push
